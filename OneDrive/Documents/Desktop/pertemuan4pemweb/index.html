<head>

<body>
    <h1>belajar javascript</h1>
    <script>
        let a = 10;
        console.log(a);
        a = 12;
        console.log(a);

        let nama = prompt("isi nama anda....")
        alert("Hai" + nama)

        let b = confirm()
        console.log(b)

        a = 80
        b = 20
        alert(a/b)

        //fungsi permainan
        function myGame(){
            let mulai;

            while (true){
                let lanjut = confirm("lanjutkan bermain?");
                //let yourname = prompt("nama kamu?"); //jika ingin meminta nama pemain
                if (lanjut == true) {
                    //pertanyaan pertama
                    let quest1 = prompt("2 + 2 = ? ");
                    if (quest1 == 4){
                        alert("benar");
                    }else{
                        alert("yah salah");
                        break;
                    }

                    //pertanyaan kedua
                    let quest2 = prompt(" 9 * 12 ");
                    if (quest2 == 108){
                        alert("benar lagi");
                        alert("hore semua jawaban benar");
                    }else{
                        alert("yah salah");
                        break;
                    }
                } else {
                    mulai = "kamu berhenti bermain";
                    alert(mulai);
                    break;
                }
            }
        }
    </script>

    <button onclick="myGame()">start</button>
</body>
